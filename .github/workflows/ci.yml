name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Biome Check
        run: npx turbo run check

      - name: TypeScript Check
        run: npx turbo run typecheck

      - name: Build Next.js
        run: npx turbo run build --filter=@workspaacing/web

      - name: Build Electron TypeScript
        run: npx turbo run build --filter=@workspaacing/desktop
